name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # lib/queries/snapshots.test.ts necesita una base real (DATABASE_URL),
      # por eso CI corre solo los tests unitarios.
      - name: Tests unitarios
        run: npm run test:unit
